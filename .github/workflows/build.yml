name: Build Cozy app (APK + IPA)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'backup_working/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: N=$((GITHUB_RUN_NUMBER + 10)); echo "N=$N" >> $GITHUB_ENV; flutter build apk --release --build-name=1.0.$N --build-number=$N --dart-define=APP_BUILD=$N
      - run: cp build/app/outputs/flutter-apk/app-release.apk Cozy-build-${{ env.N }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-android
          path: Cozy-build-${{ env.N }}.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no signing)
        run: N=$((GITHUB_RUN_NUMBER + 10)); echo "N=$N" >> $GITHUB_ENV; flutter build ios --release --no-codesign --build-name=1.0.$N --build-number=$N --dart-define=APP_BUILD=$N
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Cozy-build-${{ env.N }}-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-ios
          path: Cozy-build-${{ env.N }}-unsigned.ipa
          retention-days: 30

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to the builds branch
        run: |
          cd out
          echo "Cozy build $((GITHUB_RUN_NUMBER + 10)) ($GITHUB_SHA)" > README.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Cozy build $((GITHUB_RUN_NUMBER + 10))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
